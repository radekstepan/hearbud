name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Serialize runs per branch so concurrent master pushes can't race the version bump.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The version-bump step pushes a commit back to master.
permissions:
  contents: write

# NOTE: actions are pinned to major versions (v4) mirroring the ere-core
# pinning approach. Keep actions/*@v4; do not float or unpin.
jobs:
  # Runs on GitHub-hosted ubuntu-latest (no self-hosted dependency) so PRs
  # get fast feedback even when the Windows runner is busy/offline.
  changeset-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset on non-master branches
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "master: changeset gate skipped (release flow owns versioning there)"
            exit 0
          fi
          if [[ "${COMMIT_MSG:-}" == *"[skip ci]"* ]]; then
            echo "[skip ci]: changeset gate skipped"
            exit 0
          fi
          shopt -s nullglob
          count=0
          for f in .changeset/*.md; do
            base="$(basename "$f")"
            if [[ "$base" == "README.md" ]]; then
              continue
            fi
            count=$((count + 1))
            echo "found: $f"
          done
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Missing changeset: add a .changeset/<name>.md (\"hearbud\": patch) or include [skip ci] in the commit message. Master is exempt."
            exit 1
          fi
          echo "changeset gate passed ($count file(s))"

  build-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw 'missing: git (install Git for Windows machine-wide)'
          }
          $vc = Join-Path $env:SystemRoot 'System32\vcruntime140.dll'
          if (-not (Test-Path $vc)) {
            throw 'missing: vcruntime140.dll (install the VC++ Redistributable)'
          }
          try {
            [Net.Dns]::GetHostEntry('api.nuget.org') | Out-Null
          } catch {
            throw 'no usable network: cannot resolve api.nuget.org'
          }
          # Informational only: the SDK comes from setup-dotnet later, so an
          # absent/stale SDK here must not fail the job — just warn.
          $dotnetCmd = Get-Command dotnet -ErrorAction SilentlyContinue
          if ($dotnetCmd) {
            $PSNativeCommandUseErrorActionPreference = $false
            $sdks = dotnet --list-sdks 2>$null
            if ($sdks -match '8\.0\.1\d\d') {
              Write-Host 'dotnet SDK 8.0.1xx present pre-setup'
            } else {
              Write-Warning 'dotnet SDK 8.0.1xx not found pre-setup; setup-dotnet will install it (DOTNET_INSTALL_DIR=$env:RUNNER_TOOL_CACHE\dotnet)'
            }
          } else {
            Write-Warning 'dotnet not on PATH pre-setup; setup-dotnet will install SDK 8 into the runner tool cache'
          }
          $drive = Get-PSDrive -Name C -ErrorAction Stop
          $freeGB = [math]::Round($drive.Free / 1GB, 2)
          Write-Host "C: free ${freeGB}GB"
          if ($drive.Free -lt 5GB) {
            throw "insufficient disk space on C: (${freeGB}GB free, need >= 5GB; free space or expand the volume)"
          }
          $toolCache = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($toolCache)) {
            throw 'missing: RUNNER_TOOL_CACHE env var (runner misconfigured; setup-dotnet install target unknown)'
          }
          if (-not (Test-Path $toolCache)) {
            throw "missing: RUNNER_TOOL_CACHE dir '$toolCache' does not exist (runner misconfigured)"
          }
          $probe = Join-Path $toolCache '.hearbud-write-probe'
          try {
            [IO.File]::WriteAllText($probe, 'ok')
            Remove-Item $probe -Force
          } catch {
            throw "not writable: RUNNER_TOOL_CACHE '$toolCache' is not writable by the runner service account (check ACLs / service identity)"
          }
          git --version

      - name: Bump patch version
        id: bump
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          $pushed = $false
          $newVersion = ''
          for ($attempt = 1; $attempt -le 3 -and -not $pushed; $attempt++) {
            git fetch origin master
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git reset --hard origin/master
            if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }

            # Source of truth: Directory.Build.props (<Version>X.Y.Z</Version>).
            $props = 'Directory.Build.props'
            $text = [IO.File]::ReadAllText($props)
            if ($text -notmatch '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
              throw "No <Version> found in $props"
            }
            $newVersion = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
            # NOTE: -replace must stay in its own statement. Inside a method
            # call the comma would split into a third argument and fail with
            # "Cannot find an overload for WriteAllText and the argument count: 3".
            $newText = $text -replace '<Version>\d+\.\d+\.\d+</Version>', "<Version>$newVersion</Version>"
            [IO.File]::WriteAllText($props, $newText)

            git add $props
            git commit -m "chore: bump version to $newVersion [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
            git push origin HEAD:master
            if ($LASTEXITCODE -eq 0) { $pushed = $true }
            else { Start-Sleep -Seconds 5 }
          }
          if (-not $pushed) { throw 'Failed to push version bump after 3 attempts' }
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
        env:
          # The self-hosted runner runs as NETWORK SERVICE: Program Files is
          # not writable, so install the SDK into the runner tool cache.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet

      - name: Verify .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            throw 'missing: dotnet after setup-dotnet'
          }
          dotnet --list-sdks

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) {
              # Drop possibly truncated downloads before retrying.
              dotnet nuget locals http-cache --clear | Out-Null
              Start-Sleep -Seconds 30
            }
            dotnet restore Hearbud.sln
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'dotnet restore failed after 3 attempts' }
          }

      - name: Test
        shell: pwsh
        run: dotnet test Hearbud.sln -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish Hearbud/Hearbud.csproj -c Release -r win-x64 --self-contained -o ./dist/win-x64

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Hearbud-${{ steps.bump.outputs.version }}-windows
          path: dist/win-x64

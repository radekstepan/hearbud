name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Serialize runs per branch so concurrent master pushes can't race the version bump.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The version-bump step pushes a commit back to master.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw 'missing: git (install Git for Windows machine-wide)'
          }
          $vc = Join-Path $env:SystemRoot 'System32\vcruntime140.dll'
          if (-not (Test-Path $vc)) {
            throw 'missing: vcruntime140.dll (install the VC++ Redistributable)'
          }
          try {
            [Net.Dns]::GetHostEntry('api.nuget.org') | Out-Null
          } catch {
            throw 'no usable network: cannot resolve api.nuget.org'
          }
          git --version

      - name: Bump patch version
        id: bump
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          $pushed = $false
          $newVersion = ''
          for ($attempt = 1; $attempt -le 3 -and -not $pushed; $attempt++) {
            git fetch origin master
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git reset --hard origin/master
            if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }

            # Source of truth: Directory.Build.props (<Version>X.Y.Z</Version>).
            $props = 'Directory.Build.props'
            $text = [IO.File]::ReadAllText($props)
            if ($text -notmatch '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
              throw "No <Version> found in $props"
            }
            $newVersion = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
            [IO.File]::WriteAllText($props,
              $text -replace '<Version>\d+\.\d+\.\d+</Version>', "<Version>$newVersion</Version>")

            git add $props
            git commit -m "chore: bump version to $newVersion [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
            git push origin HEAD:master
            if ($LASTEXITCODE -eq 0) { $pushed = $true }
            else { Start-Sleep -Seconds 5 }
          }
          if (-not $pushed) { throw 'Failed to push version bump after 3 attempts' }
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
        env:
          # The self-hosted runner runs as NETWORK SERVICE: Program Files is
          # not writable, so install the SDK into the runner tool cache.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet

      - name: Verify .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            throw 'missing: dotnet after setup-dotnet'
          }
          dotnet --list-sdks

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ($attempt -gt 1) {
              # Drop possibly truncated downloads before retrying.
              dotnet nuget locals http-cache --clear | Out-Null
              Start-Sleep -Seconds 30
            }
            dotnet restore Hearbud.sln
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'dotnet restore failed after 3 attempts' }
          }

      - name: Test
        shell: pwsh
        run: dotnet test Hearbud.sln -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish Hearbud/Hearbud.csproj -c Release -r win-x64 --self-contained -o ./dist/win-x64

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Hearbud-${{ steps.bump.outputs.version }}-windows
          path: dist/win-x64
